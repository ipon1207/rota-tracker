services:
  db:
    image: postgres:18
    container_name: rota-tracker-db
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "rota_tracker"
    ports:
      - "54320:5432"
    volumes:
      # NOTE: postgres 18 以降のイメージはデータを /var/lib/postgresql/<メジャー>/docker に置くため、親ディレクトリをマウントする
      - pg-data:/var/lib/postgresql
      # NOTE: ボリュームが空の初回起動時だけ、ファイル名順（schema → seed）に実行される
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rota_tracker || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pg-data:
