# pre-commitは軽量チェック
pre-commit:
  parallel: true
  # コンフリクトの解消中やリベース中実行しない
  skip:
    - merge
    - rebase
  jobs:
    - name: web-format
      root: "web/"
      glob: "*.{ts,tsx,js,jsx,json,css,html}"
      run: npm run format:check -- {staged_files}

    - name: web-lint
      root: "web/"
      glob: "*.{ts,tsx,js,jsx}"
      run: npm run lint -- {staged_files}

    - name: api-format
      root: "api/"
      glob: "*.cs"
      run: dotnet format --verify-no-changes --include {staged_files}

# pre-pushは重いチェック
# 作業中の未コミット・未追跡ファイルに影響されないよう、push対象のコミットを一時worktreeに展開して検証する
pre-push:
  jobs:
    - name: verify-pushed-commits
      run: node scripts/verify-push.mjs
      use_stdin: true
